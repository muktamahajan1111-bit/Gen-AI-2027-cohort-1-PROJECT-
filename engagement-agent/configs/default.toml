# Multimodal Attendance & Engagement Agent - default configuration.
# Every value here can be changed without touching code.

[presence]            # sustained-presence attendance logic
confirm_sec   = 30    # a person must be visible this long before being marked present
window_sec    = 40    # sliding window used to judge "sustained"
min_ratio     = 0.7   # share of the window the person must be visible
gap_sec       = 10    # absence longer than this is logged as "left the room"
late_after_min = 10   # arrivals after this many minutes are labelled "Late"

[vision]
fps            = 5
detector       = "auto"   # auto | mediapipe | haar
max_missing_sec = 3.0     # keep a track alive this long after the face disappears

[engagement]
window_sec      = 60
yaw_limit       = 25.0    # degrees; looking further sideways counts as inattentive
pitch_limit     = 20.0
motion_eps      = 0.006   # normalised displacement below this = "still"
motion_target   = 0.03
inactive_min_sec = 20     # still stretches shorter than this are not "inactivity"
w_attention     = 0.45
w_movement      = 0.25
w_activity      = 0.30
ema_alpha       = 0.4
drop_pct        = 0.20
peak_pct        = 0.15
baseline_windows = 5

[audio]
sample_rate = 16000
frame_ms    = 30
margin_db   = 8.0
pause_turn_sec = 2.0      # silence this long starts a new "interaction burst"
discussion_turns_per_min = 6

[agent]
use_llm  = false          # true = polish advice with a local Ollama model
ollama_url = "http://localhost:11434"
model    = "llama3"
cooldown_min = 10
low_engagement   = 0.5
low_engagement_minutes = 5
no_interaction_minutes = 15

[privacy]
store_frames     = false  # raw video is never written to disk
anonymize        = true   # students appear as Student_01, Student_02 ...
consent_required = true
retention_days   = 30

[storage]
db_path = "data/maea.sqlite3"
